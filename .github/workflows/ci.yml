name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYPROOF_PYTHON: python

jobs:
  framework:
    name: framework, drivers, desktop, Steam, Xbox, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo '::warning::No lockfile yet; generating one for the extraction bootstrap.'
            pnpm install --no-frozen-lockfile
          fi
      - name: Compile Python workers
        run: $PLAYPROOF_PYTHON -m compileall -q desktop native pyboy
      - name: Full release-equivalent gate
        run: pnpm run ci

  real-pyboy-tetris:
    name: real PyBoy + pinned Tetris ROM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install JavaScript and Python dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
          python -m pip install --disable-pip-version-check pyboy==2.6.0
          python -c 'import pyboy; print(pyboy.__version__)'
      - name: Build pinned RGBDS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex libpng-dev pkg-config
          git clone https://github.com/gbdev/rgbds.git /tmp/rgbds
          git -C /tmp/rgbds checkout 9d993d84e85eeb8dd304e48463d89865795e97ed
          test "$(git -C /tmp/rgbds rev-parse HEAD)" = 9d993d84e85eeb8dd304e48463d89865795e97ed
          make -C /tmp/rgbds -j2
          sudo make -C /tmp/rgbds install
      - name: Build and identify pinned Tetris ROM
        run: |
          git clone https://github.com/alexsteb/tetris_disassembly.git /tmp/tetris
          git -C /tmp/tetris checkout b4bbceb3cc086121ab4fe9bf4dad6752fe956ec0
          test "$(git -C /tmp/tetris rev-parse HEAD)" = b4bbceb3cc086121ab4fe9bf4dad6752fe956ec0
          cd /tmp/tetris
          rgbasm -o main.o main.asm
          rgblink -o Tetris.gb main.o
          rgbfix -v -p 0 Tetris.gb
          expected=$(node -p "JSON.parse(require('fs').readFileSync('$GITHUB_WORKSPACE/pyboy/reference-tetris.json','utf8')).romMd5")
          echo "$expected  Tetris.gb" | md5sum --check --strict
      - name: Run real-emulator regression and calibration without a skip
        env:
          PLAYPROOF_ROM: /tmp/tetris/Tetris.gb
          PLAYPROOF_PYTHON: python
        run: |
          output=$(pnpm test:pyboy 2>&1 | tee /dev/stderr)
          if grep -qi 'skip' <<<"$output"; then
            echo '::error::Real PyBoy test skipped.'
            exit 1
          fi
          pnpm exec tsx calibrate.mts
