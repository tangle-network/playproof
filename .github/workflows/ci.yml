name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYPROOF_PYTHON: python

jobs:
  framework:
    name: framework, drivers, desktop, Steam, Xbox, package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo '::warning::No lockfile yet; generating one for the extraction bootstrap.'
            pnpm install --no-frozen-lockfile
          fi
      - name: Compile Python workers
        run: $PLAYPROOF_PYTHON -m compileall -q desktop native pyboy retro
      - name: Full release-equivalent gate
        run: pnpm run ci

  real-stable-retro:
    name: stable-retro multi-console adapter on a real emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install stable-retro
        run: |
          $PLAYPROOF_PYTHON -m pip install --upgrade pip
          $PLAYPROOF_PYTHON -m pip install stable-retro
      # Run this from outside the checkout: the repository's own `retro/`
      # worker directory shadows the installed package on sys.path[0].
      - name: Verify the emulator and its bundled free ROM are importable
        working-directory: ${{ runner.temp }}
        run: $PLAYPROOF_PYTHON -c "import retro, retro.data; print(len(retro.data.list_games()), 'games'); print(retro.data.get_romfile_path('Airstriker-Genesis-v0', retro.data.Integrations.ALL))"
      # Airstriker-Genesis ships with stable-retro under a free licence, so
      # this job needs no ROM secret. PLAYPROOF_REQUIRE_RETRO turns a missing
      # emulator into a failure instead of a silent skip.
      - name: Adapter gate
        run: PLAYPROOF_REQUIRE_RETRO=1 pnpm test:retro
