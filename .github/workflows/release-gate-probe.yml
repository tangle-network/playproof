name: release-gate-probe

# Temporary. The release gate reads the Actions API with the job token from the
# ci-release pool, and a tag push cannot be rehearsed, so this job runs the real
# gate against three commits whose ci result is already known and asserts the
# verdict for each. It is removed before this pull request merges; the run it
# produces is the evidence.
on:
  pull_request:
    paths:
      - '.github/workflows/release-gate-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, ci-release]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Nothing is waited for here; every commit below already has its answer.
      CI_APPEAR_MINUTES: '0'
      CI_WAIT_MINUTES: '0'
      GREEN_SHA: 270834b5a2a83bfede1eef386d77825d46e813fe
      RED_SHA: 9ac5adde6d6c1db1db30faa6e4d3931751858fc2
      ABSENT_SHA: 4b1966bce559dfea5cc34219586af1c9378ff858
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.17.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      # main at the time of writing: the ci workflow ran and all six jobs passed.
      - name: A green ci allows the release
        env:
          RELEASE_TAG: probe-green
          RELEASE_SHA: ${{ env.GREEN_SHA }}
        run: pnpm exec tsx release-gate.mts
      # The head of chore/release-0.8.0, whose ci run concluded failure.
      - name: A red ci refuses the release
        env:
          RELEASE_TAG: probe-red
          RELEASE_SHA: ${{ env.RED_SHA }}
        run: |
          set +e
          pnpm exec tsx release-gate.mts > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          sed 's/^::error:://' "$RUNNER_TEMP/red.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the gate allowed a commit whose ci concluded failure"
            exit 1
          fi
          echo "refused, as required"
      # A real commit in this repository that the ci workflow never ran on.
      - name: An absent ci result refuses the release
        env:
          RELEASE_TAG: probe-absent
          RELEASE_SHA: ${{ env.ABSENT_SHA }}
        run: |
          set +e
          pnpm exec tsx release-gate.mts > "$RUNNER_TEMP/absent.log" 2>&1
          status=$?
          set -e
          sed 's/^::error:://' "$RUNNER_TEMP/absent.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the gate allowed a commit ci never ran on"
            exit 1
          fi
          grep -q 'never looked at cannot publish' "$RUNNER_TEMP/absent.log"
          echo "refused, as required"
      # The override is a named human decision, never the default path.
      - name: A short override reason does not open the gate
        env:
          RELEASE_TAG: probe-red
          RELEASE_SHA: ${{ env.RED_SHA }}
          CI_OVERRIDE_REASON: flake
        run: |
          set +e
          pnpm exec tsx release-gate.mts > "$RUNNER_TEMP/short.log" 2>&1
          status=$?
          set -e
          sed 's/^::error:://' "$RUNNER_TEMP/short.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the gate accepted an override reason that says nothing"
            exit 1
          fi
          echo "refused, as required"
      - name: A named override reason publishes on the record
        env:
          RELEASE_TAG: probe-red
          RELEASE_SHA: ${{ env.RED_SHA }}
          CI_OVERRIDE_REASON: probe of the named override path
        run: pnpm exec tsx release-gate.mts
