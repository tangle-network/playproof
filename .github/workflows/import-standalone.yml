name: Import standalone Playproof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/import-standalone-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-standalone-playproof
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out reviewed private source tree
        uses: actions/checkout@v4
        with:
          repository: tangle-network/agent-lab
          ref: standalone/playproof-v0.1.0
          token: ${{ secrets.GH_TOKEN }}
          path: .playproof-source
          fetch-depth: 1
          persist-credentials: false

      - name: Replace target with the standalone library tree
        run: |
          set -euo pipefail
          git -C .playproof-source archive HEAD > "$RUNNER_TEMP/playproof.tar"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .playproof-source -exec rm -rf {} +
          tar -xf "$RUNNER_TEMP/playproof.tar" -C .
          rm -rf .playproof-source
          rm -f .bootstrap-source-marker
          find .github/workflows -maxdepth 1 -type f -name 'bootstrap*.yml' -delete
          rm -f .github/workflows/import-standalone.yml
          test "$(node -p "require('./package.json').name")" = '@tangle-network/playproof'
          test "$(node -p "require('./package.json').version")" = '0.1.0'
          test ! -e projects
          test ! -e .evolve
          test ! -e .bootstrap-source-marker

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact pnpm and freeze dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          test "$(pnpm --version)" = 11.17.0
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Run complete release gate
        env:
          PLAYPROOF_PYTHON: python
        run: |
          python -m compileall -q desktop native pyboy
          pnpm run ci

      - name: Commit the verified standalone repository
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'feat: import verified standalone Playproof framework'
          git push origin HEAD:main
