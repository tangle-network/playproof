name: Import verified standalone Playproof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/import-standalone-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-standalone-playproof
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify the already-tested source archive
        env:
          SOURCE_URL: https://raw.githubusercontent.com/tangle-network/agent-lab/ops/export-playproof-direct/.playproof-export/source.base64?token=ADELLF5MU7HIQUFNWQXP23LKQ5PXXAA
          SOURCE_SHA256: 263a4b42eb05f0870832c7279cf39402ca9d4f8dd9a0608d01dd628eedf913a3
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            "$SOURCE_URL" --output "$RUNNER_TEMP/playproof-source.base64"
          base64 --decode "$RUNNER_TEMP/playproof-source.base64" \
            > "$RUNNER_TEMP/playproof-source.tar.gz"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/playproof-source.tar.gz" \
            | sha256sum --check --strict

      - name: Replace the placeholder repository with the verified library
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf "$RUNNER_TEMP/playproof-source.tar.gz" -C .
          test "$(node -p "require('./package.json').name")" = '@tangle-network/playproof'
          test "$(node -p "require('./package.json').version")" = '0.1.0'
          test -f pnpm-lock.yaml
          test ! -e projects
          test ! -e .evolve
          test ! -e .bootstrap-source-marker
          test ! -e .github/workflows/import-standalone.yml

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-run the complete release gate in the public repository
        env:
          PLAYPROOF_PYTHON: python
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          python -m compileall -q desktop native pyboy
          pnpm run ci

      - name: Commit the standalone framework to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'feat: import verified standalone Playproof framework'
          git push origin HEAD:main
